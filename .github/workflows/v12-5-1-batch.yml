name: V12.5.1 No-Vercel Batch Apply

on:
  pull_request:
    branches:
      - _no-vercel/v12-5-1-work

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == '_no-vercel/v12-5-1-runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply V12.5.1 batch
        run: |
          sed -i "s/(('alpha-12', 0.14), ('beta-20', 0.15))/(('alpha-12', 0.15), ('beta-20', 0.16))/" .github/scripts/apply-v1251.py
          python .github/scripts/apply-v1251.py

      - name: Remove temporary batching helpers
        run: rm -f .github/scripts/apply-v1251.py .github/workflows/v12-5-1-batch.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build and TypeScript validation
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated batch to isolated work branch
        run: |
          git config user.name "everlastingvoyage"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "V12.5.1 give Premium frequencies distinct identity and gold presentation"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
