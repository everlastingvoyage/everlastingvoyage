name: V12.1.3 Popup Motion QA

on:
  push:
    branches:
      - v12-1-3-popup-motion-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  popup-motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare system Chrome
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/everlasting-voyage.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everlasting-voyage.log
          exit 1

      - name: Test real portal popup interactions
        run: |
          mkdir -p popup-motion-qa
          cat > popup-motion-qa.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const states = ['alpha', 'gamma', 'theta', 'delta', 'abundance'];
          const profiles = [
            { name: 'desktop', width: 1440, height: 900, iterations: 2 },
            { name: 'mobile', width: 390, height: 844, iterations: 1 }
          ];
          const results = [];
          const pageErrors = [];

          const openPopup = (page, state) => page.evaluate((activeState) => new Promise((resolve, reject) => {
            const node = document.querySelector(`#library .signalNode.${activeState}`);
            if (!(node instanceof HTMLElement)) {
              reject(new Error(`Missing signal node: ${activeState}`));
              return;
            }

            const startedAt = performance.now();
            const timeout = window.setTimeout(() => {
              observer.disconnect();
              reject(new Error(`Popup open timed out: ${activeState}`));
            }, 1800);
            const observer = new MutationObserver(() => {
              const backdrop = document.querySelector(`.evFrequencyPowerBackdrop.${activeState}:not(.closing)`);
              const card = document.querySelector('.evFrequencyPowerCard');
              if (!(backdrop instanceof HTMLElement) || !(card instanceof HTMLElement)) return;

              observer.disconnect();
              window.clearTimeout(timeout);
              window.requestAnimationFrame(() => {
                const backdropStyle = getComputedStyle(backdrop);
                const cardStyle = getComputedStyle(card);
                resolve({
                  mountMs: Math.round(performance.now() - startedAt),
                  backdropAnimationName: backdropStyle.animationName,
                  backdropAnimationDuration: backdropStyle.animationDuration,
                  cardAnimationName: cardStyle.animationName,
                  cardAnimationDuration: cardStyle.animationDuration
                });
              });
            });

            observer.observe(document.body, { childList: true, subtree: true });
            node.click();
          }), state);

          const closePopup = (page, method) => page.evaluate((closeMethod) => new Promise((resolve, reject) => {
            const backdrop = document.querySelector('.evFrequencyPowerBackdrop');
            if (!(backdrop instanceof HTMLElement)) {
              reject(new Error('Popup backdrop is missing'));
              return;
            }

            const startedAt = performance.now();
            let closingMotion = null;
            const timeout = window.setTimeout(() => {
              observer.disconnect();
              reject(new Error(`Popup close timed out: ${closeMethod}`));
            }, 1600);
            const observer = new MutationObserver(() => {
              const closingBackdrop = document.querySelector('.evFrequencyPowerBackdrop.closing');
              const closingCard = document.querySelector('.evFrequencyPowerBackdrop.closing .evFrequencyPowerCard');

              if (!closingMotion && closingBackdrop instanceof HTMLElement && closingCard instanceof HTMLElement) {
                const backdropStyle = getComputedStyle(closingBackdrop);
                const cardStyle = getComputedStyle(closingCard);
                closingMotion = {
                  backdropAnimationName: backdropStyle.animationName,
                  backdropAnimationDuration: backdropStyle.animationDuration,
                  cardAnimationName: cardStyle.animationName,
                  cardAnimationDuration: cardStyle.animationDuration
                };
              }

              if (document.querySelector('.evFrequencyPowerBackdrop')) return;
              observer.disconnect();
              window.clearTimeout(timeout);
              window.requestAnimationFrame(() => resolve({
                cleanupMs: Math.round(performance.now() - startedAt),
                ...(closingMotion ?? {})
              }));
            });

            observer.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class']
            });

            if (closeMethod === 'button') {
              const button = document.querySelector('.evFrequencyPowerTop button[aria-label="Close frequency details"]');
              if (!(button instanceof HTMLButtonElement)) {
                observer.disconnect();
                window.clearTimeout(timeout);
                reject(new Error('Close button is missing'));
                return;
              }
              button.click();
              return;
            }

            if (closeMethod === 'escape') {
              window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
              return;
            }

            if (closeMethod === 'outside') {
              backdrop.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
              return;
            }

            const action = document.querySelector('.evFrequencyPowerAction');
            if (!(action instanceof HTMLButtonElement)) {
              observer.disconnect();
              window.clearTimeout(timeout);
              reject(new Error('Use state button is missing'));
              return;
            }
            action.click();
          }), method);

          const readState = (page) => page.evaluate(() => {
            const backdrop = document.querySelector('.evFrequencyPowerBackdrop');
            const card = document.querySelector('.evFrequencyPowerCard');
            const stage = document.querySelector('#library .signalStage');
            const wave = document.querySelector('#library .signalTransitionWave');
            if (!backdrop || !card || !stage) throw new Error('Required popup elements are missing');

            const backdropStyle = getComputedStyle(backdrop);
            const cardStyle = getComputedStyle(card);
            const stageStyle = getComputedStyle(stage);
            const legacy = document.querySelector('#library .signalPopupOverlay:not(.signalPopupExitGhost)');
            return {
              backdropFilter: backdropStyle.backdropFilter || backdropStyle.webkitBackdropFilter || 'none',
              cardFilter: cardStyle.filter,
              stageAnimationName: stageStyle.animationName,
              stageFilter: stageStyle.filter,
              waveDisplay: wave ? getComputedStyle(wave).display : 'not-mounted',
              portalCount: document.querySelectorAll('.evFrequencyPowerBackdrop').length,
              legacyPopupOpacity: legacy ? getComputedStyle(legacy).opacity : 'not-mounted'
            };
          });

          const readCleanup = (page) => page.evaluate(() => ({
            portals: document.querySelectorAll('.evFrequencyPowerBackdrop').length,
            liveLegacy: document.querySelectorAll('#library .signalPopupOverlay:not(.signalPopupExitGhost)').length,
            exitGhosts: document.querySelectorAll('#library .signalPopupExitGhost').length,
            openClass: document.body.classList.contains('ev-frequency-power-open'),
            closingClass: document.body.classList.contains('ev-frequency-power-closing')
          }));

          const durationMs = (value = '0s') => Math.max(
            ...String(value).split(',').map((part) => {
              const trimmed = part.trim();
              if (trimmed.endsWith('ms')) return Number.parseFloat(trimmed);
              if (trimmed.endsWith('s')) return Number.parseFloat(trimmed) * 1000;
              return Number.parseFloat(trimmed) || 0;
            })
          );

          for (const profile of profiles) {
            const page = await browser.newPage();
            await page.setViewport({ width: profile.width, height: profile.height, deviceScaleFactor: 1 });
            page.on('pageerror', (error) => pageErrors.push(`${profile.name}: ${String(error)}`));

            await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
            await page.waitForSelector('#library.evFrequencyChamber');
            await page.evaluate(() => document.querySelector('#library')?.scrollIntoView({ block: 'center' }));
            await new Promise((resolve) => setTimeout(resolve, 300));

            for (const state of states) {
              for (let iteration = 0; iteration < profile.iterations; iteration += 1) {
                const opening = await openPopup(page, state);
                const styles = await readState(page);

                if (iteration === 0) {
                  await page.screenshot({
                    path: `popup-motion-qa/${profile.name}-${state}-open.png`,
                    fullPage: false
                  });
                }

                const closing = await closePopup(page, 'button');
                await page.waitForFunction(() =>
                  !document.body.classList.contains('ev-frequency-power-open') &&
                  !document.body.classList.contains('ev-frequency-power-closing')
                );
                const cleanup = await readCleanup(page);

                results.push({
                  profile: profile.name,
                  state,
                  iteration: iteration + 1,
                  opening,
                  closing,
                  cleanup,
                  ...styles
                });
              }
            }

            await openPopup(page, 'alpha');
            results.push({ profile: profile.name, interaction: 'escape', closing: await closePopup(page, 'escape') });

            await openPopup(page, 'gamma');
            results.push({ profile: profile.name, interaction: 'outside-click', closing: await closePopup(page, 'outside') });

            await openPopup(page, 'theta');
            const useStateClosing = await closePopup(page, 'use-state');
            await page.waitForFunction(() => document.querySelector('.stateChoice.theta')?.classList.contains('active'));
            results.push({ profile: profile.name, interaction: 'use-state', closing: useStateClosing });

            await page.close();
          }

          const cycles = results.filter((item) => item.state);
          const interactions = results.filter((item) => item.interaction);
          const allClosures = [...cycles.map((item) => item.closing), ...interactions.map((item) => item.closing)];
          const summary = {
            pageErrors,
            results,
            maxMountMs: Math.max(...cycles.map((item) => item.opening.mountMs)),
            maxOpenVisualMs: Math.max(...cycles.flatMap((item) => [
              durationMs(item.opening.backdropAnimationDuration),
              durationMs(item.opening.cardAnimationDuration)
            ])),
            maxCloseVisualMs: Math.max(...allClosures.flatMap((item) => [
              durationMs(item.backdropAnimationDuration),
              durationMs(item.cardAnimationDuration)
            ])),
            maxCleanupMs: Math.max(...allClosures.map((item) => item.cleanupMs))
          };
          fs.writeFileSync('popup-motion-qa/results.json', JSON.stringify(summary, null, 2));

          const invalidCleanup = cycles.some((item) =>
            item.cleanup.portals !== 0 ||
            item.cleanup.liveLegacy !== 0 ||
            item.cleanup.exitGhosts !== 0 ||
            item.cleanup.openClass ||
            item.cleanup.closingClass
          );

          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (invalidCleanup) throw new Error('Popup state was not completely cleaned after close');
          if (cycles.some((item) => item.portalCount !== 1)) throw new Error('Duplicate portal detected');
          if (cycles.some((item) => item.cardFilter !== 'none')) throw new Error('Card blur/filter is still active');
          if (cycles.some((item) => !['none', ''].includes(item.backdropFilter))) throw new Error('Backdrop blur is still active');
          if (cycles.some((item) => item.stageAnimationName !== 'none')) throw new Error('Full-stage animation is still active');
          if (cycles.some((item) => item.stageFilter !== 'none')) throw new Error('Full-stage filter is still active');
          if (cycles.some((item) => !['none', 'not-mounted'].includes(item.waveDisplay))) throw new Error('Transition wave is still visible');
          if (cycles.some((item) => !['0', 'not-mounted'].includes(item.legacyPopupOpacity))) throw new Error('Legacy popup became visible');
          if (cycles.some((item) => item.opening.backdropAnimationName !== 'evFrequencyBackdropQuickIn')) throw new Error('Unexpected backdrop entrance animation');
          if (cycles.some((item) => item.opening.cardAnimationName !== 'evFrequencyCardQuickIn')) throw new Error('Unexpected card entrance animation');
          if (allClosures.some((item) => item.backdropAnimationName !== 'evFrequencyBackdropQuickOut')) throw new Error('Unexpected backdrop exit animation');
          if (allClosures.some((item) => item.cardAnimationName !== 'evFrequencyCardQuickOut')) throw new Error('Unexpected card exit animation');
          if (summary.maxOpenVisualMs > 200) throw new Error(`Visible popup entrance exceeded target: ${summary.maxOpenVisualMs} ms`);
          if (summary.maxCloseVisualMs > 160) throw new Error(`Visible popup exit exceeded target: ${summary.maxCloseVisualMs} ms`);
          if (summary.maxMountMs > 1200) throw new Error(`Popup mount exceeded safety threshold: ${summary.maxMountMs} ms`);
          if (summary.maxCleanupMs > 900) throw new Error(`Popup cleanup exceeded safety threshold: ${summary.maxCleanupMs} ms`);

          await browser.close();
          EOF
          node popup-motion-qa.mjs
          rm popup-motion-qa.mjs

      - name: Upload popup QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-3-popup-motion-qa
          path: popup-motion-qa
          if-no-files-found: warn
          retention-days: 7
