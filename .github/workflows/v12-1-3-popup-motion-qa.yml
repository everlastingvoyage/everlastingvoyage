name: V12.1.3 Popup Motion QA

on:
  push:
    branches:
      - v12-1-3-popup-motion-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  popup-motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare system Chrome
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/everlasting-voyage.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everlasting-voyage.log
          exit 1

      - name: Test repeated popup interactions
        run: |
          mkdir -p popup-motion-qa
          cat > popup-motion-qa.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 1440, height: 900, deviceScaleFactor: 1 });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));

          await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
          await page.waitForSelector('#library.evFrequencyChamber');
          await page.evaluate(() => document.querySelector('#library')?.scrollIntoView({ block: 'center' }));
          await new Promise((resolve) => setTimeout(resolve, 500));

          const states = ['alpha', 'gamma', 'theta', 'delta', 'abundance'];
          const results = [];

          for (const state of states) {
            for (let iteration = 0; iteration < 3; iteration += 1) {
              const start = Date.now();
              await page.click(`#library .signalNode.${state}`);
              await page.waitForSelector(`#library .signalPopupOverlay.${state}:not(.signalPopupExitGhost)`);
              await page.evaluate(async () => {
                const popup = document.querySelector('#library .signalPopupOverlay:not(.signalPopupExitGhost)');
                if (!popup) throw new Error('Popup did not mount');
                await Promise.all(popup.getAnimations().map((animation) => animation.finished.catch(() => undefined)));
              });
              const openedInMs = Date.now() - start;

              const openStyles = await page.evaluate(() => {
                const popup = document.querySelector('#library .signalPopupOverlay:not(.signalPopupExitGhost)');
                const stage = document.querySelector('#library .signalStage');
                const wave = document.querySelector('#library .signalTransitionWave');
                if (!popup || !stage) throw new Error('Required popup elements missing');
                const popupStyle = getComputedStyle(popup);
                const stageStyle = getComputedStyle(stage);
                return {
                  popupAnimationName: popupStyle.animationName,
                  popupAnimationDuration: popupStyle.animationDuration,
                  popupFilter: popupStyle.filter,
                  stageAnimationName: stageStyle.animationName,
                  stageFilter: stageStyle.filter,
                  waveDisplay: wave ? getComputedStyle(wave).display : 'not-mounted'
                };
              });

              if (iteration === 0) {
                await page.screenshot({ path: `popup-motion-qa/${state}-open.png`, fullPage: false });
              }

              const closeStart = Date.now();
              await page.click('#library .signalPopupClose');
              await page.waitForFunction(() => !document.querySelector('#library .signalPopupOverlay:not(.signalPopupExitGhost)'));
              const closedInMs = Date.now() - closeStart;

              await new Promise((resolve) => setTimeout(resolve, 180));
              const visibleGhosts = await page.evaluate(() =>
                Array.from(document.querySelectorAll('#library .signalPopupExitGhost')).filter((node) => {
                  const style = getComputedStyle(node);
                  return style.display !== 'none' && Number(style.opacity) > 0.01;
                }).length
              );

              results.push({ state, iteration: iteration + 1, openedInMs, closedInMs, visibleGhosts, ...openStyles });
            }
          }

          const summary = {
            pageErrors,
            results,
            maxOpenMs: Math.max(...results.map((item) => item.openedInMs)),
            maxCloseMs: Math.max(...results.map((item) => item.closedInMs)),
            remainingLivePopups: await page.evaluate(() => document.querySelectorAll('#library .signalPopupOverlay:not(.signalPopupExitGhost)').length)
          };

          fs.writeFileSync('popup-motion-qa/results.json', JSON.stringify(summary, null, 2));

          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (summary.remainingLivePopups !== 0) throw new Error('A live popup remained after QA');
          if (results.some((item) => item.visibleGhosts > 0)) throw new Error('An exit ghost stayed visibly rendered');
          if (results.some((item) => item.popupFilter !== 'none')) throw new Error('Popup blur/filter is still active');
          if (results.some((item) => item.stageAnimationName !== 'none')) throw new Error('Full-stage animation is still active');
          if (results.some((item) => item.stageFilter !== 'none')) throw new Error('Full-stage filter is still active');
          if (results.some((item) => !['none', 'not-mounted'].includes(item.waveDisplay))) throw new Error('Transition wave is still visible');

          await browser.close();
          EOF
          node popup-motion-qa.mjs
          rm popup-motion-qa.mjs

      - name: Upload popup QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-3-popup-motion-qa
          path: popup-motion-qa
          if-no-files-found: error
          retention-days: 7
