name: V12.1.3 Popup Motion QA

on:
  push:
    branches:
      - v12-1-3-popup-motion-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  popup-motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare system Chrome
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/everlasting-voyage.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everlasting-voyage.log
          exit 1

      - name: Test real portal popup interactions
        run: |
          mkdir -p popup-motion-qa
          cat > popup-motion-qa.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const states = ['alpha', 'gamma', 'theta', 'delta', 'abundance'];
          const testProfiles = [
            { name: 'desktop', width: 1440, height: 900, iterations: 2 },
            { name: 'mobile', width: 390, height: 844, iterations: 1 }
          ];
          const allResults = [];
          const pageErrors = [];

          const waitForMotion = async (page) => {
            await page.evaluate(async () => {
              const backdrop = document.querySelector('.evFrequencyPowerBackdrop');
              const card = document.querySelector('.evFrequencyPowerCard');
              if (!backdrop || !card) throw new Error('Frequency Power popup did not mount');
              await Promise.all(
                [...backdrop.getAnimations(), ...card.getAnimations()].map((animation) =>
                  animation.finished.catch(() => undefined)
                )
              );
            });
          };

          const openPopup = async (page, state) => {
            await page.evaluate(() => document.querySelector('#library')?.scrollIntoView({ block: 'center' }));
            const startedAt = await page.evaluate((activeState) => {
              const node = document.querySelector(`#library .signalNode.${activeState}`);
              if (!(node instanceof HTMLElement)) throw new Error(`Missing signal node: ${activeState}`);
              const start = performance.now();
              node.click();
              return start;
            }, state);
            await page.waitForSelector(`.evFrequencyPowerBackdrop.${state}:not(.closing)`, { timeout: 3000 });
            await waitForMotion(page);
            return page.evaluate((start) => Math.round(performance.now() - start), startedAt);
          };

          const closeWithButton = async (page) => {
            const startedAt = await page.evaluate(() => {
              const button = document.querySelector('.evFrequencyPowerTop button[aria-label="Close frequency details"]');
              if (!(button instanceof HTMLButtonElement)) throw new Error('Close button is missing');
              const start = performance.now();
              button.click();
              return start;
            });
            await page.waitForSelector('.evFrequencyPowerBackdrop.closing', { timeout: 1000 });
            await page.waitForSelector('.evFrequencyPowerBackdrop', { hidden: true, timeout: 1500 });
            return page.evaluate((start) => Math.round(performance.now() - start), startedAt);
          };

          const readMotionState = (page) => page.evaluate(() => {
            const backdrop = document.querySelector('.evFrequencyPowerBackdrop');
            const card = document.querySelector('.evFrequencyPowerCard');
            const stage = document.querySelector('#library .signalStage');
            const wave = document.querySelector('#library .signalTransitionWave');
            if (!backdrop || !card || !stage) throw new Error('Required popup elements are missing');

            const backdropStyle = getComputedStyle(backdrop);
            const cardStyle = getComputedStyle(card);
            const stageStyle = getComputedStyle(stage);
            return {
              backdropAnimationName: backdropStyle.animationName,
              backdropAnimationDuration: backdropStyle.animationDuration,
              backdropFilter: backdropStyle.backdropFilter || backdropStyle.webkitBackdropFilter || 'none',
              cardAnimationName: cardStyle.animationName,
              cardAnimationDuration: cardStyle.animationDuration,
              cardFilter: cardStyle.filter,
              stageAnimationName: stageStyle.animationName,
              stageFilter: stageStyle.filter,
              waveDisplay: wave ? getComputedStyle(wave).display : 'not-mounted',
              portalCount: document.querySelectorAll('.evFrequencyPowerBackdrop').length,
              legacyPopupOpacity: (() => {
                const legacy = document.querySelector('#library .signalPopupOverlay:not(.signalPopupExitGhost)');
                return legacy ? getComputedStyle(legacy).opacity : 'not-mounted';
              })()
            };
          });

          for (const profile of testProfiles) {
            const page = await browser.newPage();
            await page.setViewport({ width: profile.width, height: profile.height, deviceScaleFactor: 1 });
            page.on('pageerror', (error) => pageErrors.push(`${profile.name}: ${String(error)}`));

            await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
            await page.waitForSelector('#library.evFrequencyChamber');
            await page.evaluate(() => document.querySelector('#library')?.scrollIntoView({ block: 'center' }));
            await new Promise((resolve) => setTimeout(resolve, 300));

            for (const state of states) {
              for (let iteration = 0; iteration < profile.iterations; iteration += 1) {
                console.log(`${profile.name}: opening ${state} ${iteration + 1}`);
                const openedInMs = await openPopup(page, state);
                const styles = await readMotionState(page);

                if (iteration === 0) {
                  await page.screenshot({
                    path: `popup-motion-qa/${profile.name}-${state}-open.png`,
                    fullPage: false
                  });
                }

                console.log(`${profile.name}: closing ${state} ${iteration + 1}`);
                const closedInMs = await closeWithButton(page);
                await page.waitForFunction(() => !document.body.classList.contains('ev-frequency-power-open'));

                const cleanup = await page.evaluate(() => ({
                  portals: document.querySelectorAll('.evFrequencyPowerBackdrop').length,
                  liveLegacy: document.querySelectorAll('#library .signalPopupOverlay:not(.signalPopupExitGhost)').length,
                  exitGhosts: document.querySelectorAll('#library .signalPopupExitGhost').length,
                  closingClass: document.body.classList.contains('ev-frequency-power-closing')
                }));

                allResults.push({
                  profile: profile.name,
                  state,
                  iteration: iteration + 1,
                  openedInMs,
                  closedInMs,
                  cleanup,
                  ...styles
                });

                /* The next loop starts immediately; this detects the removed 620 ms lock. */
              }
            }

            await openPopup(page, 'alpha');
            const escapeStartedAt = await page.evaluate(() => performance.now());
            await page.keyboard.press('Escape');
            await page.waitForSelector('.evFrequencyPowerBackdrop', { hidden: true, timeout: 1500 });
            allResults.push({
              profile: profile.name,
              interaction: 'escape',
              closedInMs: await page.evaluate((start) => Math.round(performance.now() - start), escapeStartedAt)
            });

            await openPopup(page, 'gamma');
            const outsideStartedAt = await page.evaluate(() => {
              const backdrop = document.querySelector('.evFrequencyPowerBackdrop');
              if (!(backdrop instanceof HTMLElement)) throw new Error('Backdrop is missing');
              const start = performance.now();
              backdrop.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
              return start;
            });
            await page.waitForSelector('.evFrequencyPowerBackdrop', { hidden: true, timeout: 1500 });
            allResults.push({
              profile: profile.name,
              interaction: 'outside-click',
              closedInMs: await page.evaluate((start) => Math.round(performance.now() - start), outsideStartedAt)
            });

            await openPopup(page, 'theta');
            const actionStartedAt = await page.evaluate(() => {
              const button = document.querySelector('.evFrequencyPowerAction');
              if (!(button instanceof HTMLButtonElement)) throw new Error('Use state button is missing');
              const start = performance.now();
              button.click();
              return start;
            });
            await page.waitForSelector('.evFrequencyPowerBackdrop', { hidden: true, timeout: 1500 });
            await page.waitForFunction(() => document.querySelector('.stateChoice.theta')?.classList.contains('active'));
            allResults.push({
              profile: profile.name,
              interaction: 'use-state',
              closedInMs: await page.evaluate((start) => Math.round(performance.now() - start), actionStartedAt)
            });

            await page.close();
          }

          const measuredCycles = allResults.filter((item) => item.state);
          const standardClosures = allResults.filter((item) => item.state || ['escape', 'outside-click'].includes(item.interaction));
          const useStateClosures = allResults.filter((item) => item.interaction === 'use-state');
          const summary = {
            pageErrors,
            allResults,
            maxOpenMs: Math.max(...measuredCycles.map((item) => item.openedInMs)),
            maxStandardCloseMs: Math.max(...standardClosures.map((item) => item.closedInMs)),
            maxUseStateCloseMs: Math.max(...useStateClosures.map((item) => item.closedInMs))
          };
          fs.writeFileSync('popup-motion-qa/results.json', JSON.stringify(summary, null, 2));

          const invalidCleanup = measuredCycles.some((item) =>
            item.cleanup.portals !== 0 ||
            item.cleanup.liveLegacy !== 0 ||
            item.cleanup.exitGhosts !== 0 ||
            item.cleanup.closingClass
          );

          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          if (invalidCleanup) throw new Error('Popup state was not completely cleaned after close');
          if (measuredCycles.some((item) => item.portalCount !== 1)) throw new Error('Duplicate portal detected');
          if (measuredCycles.some((item) => item.cardFilter !== 'none')) throw new Error('Card blur/filter is still active');
          if (measuredCycles.some((item) => !['none', ''].includes(item.backdropFilter))) throw new Error('Backdrop blur is still active');
          if (measuredCycles.some((item) => item.stageAnimationName !== 'none')) throw new Error('Full-stage animation is still active');
          if (measuredCycles.some((item) => item.stageFilter !== 'none')) throw new Error('Full-stage filter is still active');
          if (measuredCycles.some((item) => !['none', 'not-mounted'].includes(item.waveDisplay))) throw new Error('Transition wave is still visible');
          if (measuredCycles.some((item) => !['0', 'not-mounted'].includes(item.legacyPopupOpacity))) throw new Error('Legacy popup became visible');
          if (summary.maxOpenMs > 400) throw new Error(`Popup opening exceeded target: ${summary.maxOpenMs} ms`);
          if (summary.maxStandardCloseMs > 350) throw new Error(`Popup closing exceeded target: ${summary.maxStandardCloseMs} ms`);
          if (summary.maxUseStateCloseMs > 650) throw new Error(`Use-state close exceeded target: ${summary.maxUseStateCloseMs} ms`);

          await browser.close();
          EOF
          node popup-motion-qa.mjs
          rm popup-motion-qa.mjs

      - name: Upload popup QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-3-popup-motion-qa
          path: popup-motion-qa
          if-no-files-found: warn
          retention-days: 7
