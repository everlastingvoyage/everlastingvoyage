name: V12.5 No-Vercel Batch Apply

on:
  pull_request:
    branches:
      - _no-vercel/v12-5-work
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, '_no-vercel/v12-5-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
      BASE_BRANCH: _no-vercel/v12-5-work
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source transformation during install
        run: npm install

      - name: Validate production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Remove isolated QA scaffolding
        shell: bash
        run: |
          git fetch origin "$BASE_BRANCH" --depth=1
          git show "origin/$BASE_BRANCH:package.json" > package.json
          if git cat-file -e "origin/$BASE_BRANCH:package-lock.json" 2>/dev/null; then
            git show "origin/$BASE_BRANCH:package-lock.json" > package-lock.json
          else
            rm -f package-lock.json
          fi
          rm -rf scripts/v12_5_patch.py scripts/v12_5_run.py popup-motion-qa

      - name: Commit validated V12.5 source batch
        shell: bash
        run: |
          git config user.name "Everlasting Voyage Build"
          git config user.email "actions@users.noreply.github.com"
          git add app/V10ProductFlow.tsx app/V10VoyageEngine.tsx app/V11AmbientMixer.tsx app/V10CompletionFlow.tsx app/v11-8-completion-polish.css package.json
          git add -A scripts
          git diff --cached --check
          git status --short
          git commit -m "V12.5 apply shared sonic engine and reliability changes"
          git push origin "HEAD:$HEAD_BRANCH"
