name: V12.5.2 no-Vercel work

on:
  push:
    branches:
      - _no-vercel/v12-5-2-work
    paths:
      - .github/workflows/v12-5-2-work.yml

permissions:
  contents: write

jobs:
  build-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _no-vercel/v12-5-2-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply V12.5.2 batch
        shell: bash
        run: |
          python3 - <<'PY'
