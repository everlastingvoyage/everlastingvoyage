name: V12.1.4 Session Layout and History QA

on:
  push:
    branches:
      - v12-1-3-popup-motion-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  session-layout-history-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare system Chrome
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/everlasting-voyage.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everlasting-voyage.log
          exit 1

      - name: Validate Pomodoro layout and browser Back
        run: |
          mkdir -p session-layout-history-qa
          cat > session-layout-history-qa.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const profiles = [
            { name: 'scaled-desktop-short', width: 1024, height: 640 },
            { name: 'scaled-desktop', width: 1024, height: 768 },
            { name: 'narrow-desktop', width: 900, height: 700 },
            { name: 'desktop', width: 1440, height: 900 }
          ];
          const results = [];
          const pageErrors = [];

          const overlaps = (a, b) => {
            const width = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
            const height = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
            return width * height;
          };

          for (const profile of profiles) {
            const page = await browser.newPage();
            await page.setViewport({ width: profile.width, height: profile.height, deviceScaleFactor: 1 });
            page.on('pageerror', (error) => pageErrors.push(`${profile.name}: ${String(error)}`));

            await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
            await page.waitForSelector('#session-builder');
            await page.evaluate(() => document.querySelector('#session-builder')?.scrollIntoView({ block: 'center' }));
            await page.click('.stateChoice.abundance');
            await page.click('.builderActions .primaryButton');
            await page.waitForSelector('.v10SessionOverlay.abundance:not(.completed)');
            await new Promise((resolve) => setTimeout(resolve, 450));

            const layout = await page.evaluate(() => {
              const rect = (element) => {
                const value = element.getBoundingClientRect();
                return {
                  left: value.left,
                  top: value.top,
                  right: value.right,
                  bottom: value.bottom,
                  width: value.width,
                  height: value.height
                };
              };
              const visible = (element) => {
                const style = getComputedStyle(element);
                const value = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0 && value.width > 0 && value.height > 0;
              };

              const identity = document.querySelector('.v10SessionIdentity');
              const timer = document.querySelector('.v10TimerArea');
              const controls = document.querySelector('.v10TimerControls');
              if (!identity || !timer || !controls) throw new Error('Pomodoro layout elements are missing');

              const textElements = Array.from(identity.querySelectorAll('.v10SessionEyebrow, h2, p'))
                .filter(visible)
                .map((element) => ({
                  tag: element.tagName,
                  text: element.textContent?.trim() ?? '',
                  rect: rect(element)
                }));
              const controlElements = Array.from(controls.querySelectorAll('button'))
                .filter(visible)
                .map((element) => ({
                  text: element.textContent?.trim() ?? '',
                  rect: rect(element)
                }));

              return {
                identity: rect(identity),
                timer: rect(timer),
                controls: rect(controls),
                textElements,
                controlElements,
                pathname: window.location.pathname,
                hash: window.location.hash,
                historyMarker: window.history.state?.evVoyageSession === true,
                overlayCount: document.querySelectorAll('.v10SessionOverlay').length
              };
            });

            const collisions = [];
            const identityTimerOverlap = overlaps(layout.identity, layout.timer);
            if (identityTimerOverlap > 4) {
              collisions.push({ pair: 'identity/timer', area: identityTimerOverlap });
            }

            for (const text of layout.textElements) {
              for (const control of layout.controlElements) {
                const area = overlaps(text.rect, control.rect);
                if (area > 1) collisions.push({ pair: `${text.text}/${control.text}`, area });
              }
            }

            for (let index = 0; index < layout.textElements.length - 1; index += 1) {
              const current = layout.textElements[index];
              const next = layout.textElements[index + 1];
              const area = overlaps(current.rect, next.rect);
              if (area > 1) collisions.push({ pair: `${current.text}/${next.text}`, area });
            }

            await page.screenshot({
              path: `session-layout-history-qa/${profile.name}-abundance.png`,
              fullPage: false
            });

            await page.evaluate(() => window.history.back());
            await page.waitForSelector('.v10SessionOverlay', { hidden: true, timeout: 2500 });
            await new Promise((resolve) => setTimeout(resolve, 320));

            const navigation = await page.evaluate(() => ({
              pathname: window.location.pathname,
              hash: window.location.hash,
              scrollY: window.scrollY,
              sessionOpen: Boolean(document.querySelector('.v10SessionOverlay')),
              landingOpen: Boolean(document.querySelector('.evEntrance')),
              heroTop: document.getElementById('top')?.getBoundingClientRect().top ?? null
            }));

            results.push({ profile, layout, collisions, navigation });
            await page.close();
          }

          const summary = { pageErrors, results };
          fs.writeFileSync('session-layout-history-qa/results.json', JSON.stringify(summary, null, 2));

          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
          const collisions = results.flatMap((result) => result.collisions.map((collision) => ({
            profile: result.profile.name,
            ...collision
          })));
          if (collisions.length) throw new Error(`Pomodoro collisions detected: ${JSON.stringify(collisions)}`);
          if (results.some((result) => result.layout.pathname !== '/voyage')) throw new Error('Session did not open on /voyage');
          if (results.some((result) => result.layout.hash !== '#session')) throw new Error('Session history marker URL was not created');
          if (results.some((result) => !result.layout.historyMarker)) throw new Error('Session history state was not created');
          if (results.some((result) => result.layout.overlayCount !== 1)) throw new Error('Duplicate Pomodoro overlay detected');
          if (results.some((result) => result.navigation.pathname !== '/voyage')) throw new Error('Browser Back left the Voyage route');
          if (results.some((result) => result.navigation.hash === '#session')) throw new Error('Browser Back retained the session hash');
          if (results.some((result) => result.navigation.sessionOpen)) throw new Error('Browser Back did not close Pomodoro');
          if (results.some((result) => result.navigation.landingOpen)) throw new Error('Browser Back opened the landing gate');
          if (results.some((result) => result.navigation.scrollY > 12)) throw new Error('Browser Back did not return to the Voyage hero');

          await browser.close();
          EOF
          node session-layout-history-qa.mjs
          rm session-layout-history-qa.mjs

      - name: Upload session QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-4-session-layout-history-qa
          path: session-layout-history-qa
          if-no-files-found: warn
          retention-days: 7
