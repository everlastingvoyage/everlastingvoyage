name: V12.5.2 Final No-Vercel QA

on:
  pull_request:
    branches:
      - _no-vercel/v12-5-2-work

permissions:
  contents: write

jobs:
  final-polish-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _no-vercel/v12-5-2-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final consistency polish
        run: python3 scripts/v1252-finalize.py

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare Chrome and browser QA dependency
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ev-v1252.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ev-v1252.log
          exit 1

      - name: Browser product QA
        run: node scripts/v1252-qa.mjs

      - name: Restore trusted workflow and commit validated polish
        shell: bash
        run: |
          git checkout 1d704e7a4548d60f62e20a3ea6c8bde21a4e7b97 -- .github/workflows/v12-1-5-session-footer-qa.yml
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f package-lock.json scripts/v1252-finalize.py scripts/v1252-qa.mjs
          git config user.name "Everlasting Voyage Build"
          git config user.email "actions@users.noreply.github.com"
          git add app .github/workflows/v12-1-5-session-footer-qa.yml scripts/v1252-finalize.py scripts/v1252-qa.mjs
          git commit -m "V12.5.2 final consistency and browser QA"
          git push origin HEAD:_no-vercel/v12-5-2-work
