# Existing trusted workflow path temporarily repurposed on an ignored branch only.
name: V12.5.2 Trusted No-Vercel Executor

on:
  push:
    branches:
      - _no-vercel/v12-5-2-work
    paths:
      - .github/workflows/v12-1-5-session-footer-qa.yml

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _no-vercel/v12-5-2-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract and run V12.5.2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v12-5-2-work.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v12-5-2-apply.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/v12-5-2-apply.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify protected Ritual legacy audio was not edited
        shell: bash
        run: |
          changed=$(git diff -U0 -- app/V10VoyageEngine.tsx app/premium-audio-engine.ts | grep '^+' | grep -E "pure-(222|444|528|963)|888 Hz" || true)
          if [ -n "$changed" ]; then
            echo "Protected Ritual lines changed unexpectedly:"
            echo "$changed"
            exit 1
          fi

      - name: Restore QA workflow, remove temporary workflow, commit validated product batch
        shell: bash
        run: |
          git checkout 1d704e7a4548d60f62e20a3ea6c8bde21a4e7b97 -- .github/workflows/v12-1-5-session-footer-qa.yml
          rm -f .github/workflows/v12-5-2-work.yml
          git config user.name "Everlasting Voyage Build"
          git config user.email "actions@users.noreply.github.com"
          git add app .github/workflows/v12-1-5-session-footer-qa.yml .github/workflows/v12-5-2-work.yml
          git status --short
          git commit -m "V12.5.2 validated product batch"
          git push origin HEAD:_no-vercel/v12-5-2-work
