name: V12.5.2 Final No-Vercel QA

on:
  pull_request:
    branches:
      - _no-vercel/v12-5-2-work

permissions:
  contents: write

jobs:
  final-polish-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _no-vercel/v12-5-2-work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final consistency polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/V10ProductFlow.tsx')
          s = p.read_text()
          old = "{ id: 'gamma-30', category: 'work', family: 'Gamma', hz: 30, label: 'Reflective Space'"
          new = "{ id: 'gamma-30', category: 'work', family: 'Gamma', hz: 30, label: 'Creative Spark'"
          if old not in s: raise SystemExit('gamma-30 product label target missing')
          s = s.replace(old, new, 1)
          old = "{ id: 'theta', category: 'meditation', family: 'Theta', hz: 4, label: 'Creative Spark'"
          new = "{ id: 'theta', category: 'meditation', family: 'Theta', hz: 4, label: 'Reflective Space'"
          if old not in s: raise SystemExit('theta product label target missing')
          s = s.replace(old, new, 1)
          s = s.replace("{ id: 'work', title: 'Deep Work', subtitle: 'Lock in. Create. Execute.'", "{ id: 'work', title: 'Deep Work', subtitle: 'Create. Build. Achieve.'", 1)
          s = s.replace("description: 'The free Gamma flagship for demanding focus sessions.'", "description: 'The free Gamma flagship for demanding clarity and high-attention sessions.'", 1)
          s = s.replace(".evPremiumLibraryTitle{margin:0 0 12px;color:#f0c66f;font-size:clamp(22px,2.5vw,34px);", ".evPremiumLibraryTitle{margin:0 0 12px;color:#f0c66f;font-size:clamp(28px,3vw,42px);", 1)
          s = s.replace(".evPremiumBenefitRow span:nth-child(4){--ev-chip:74,226,213;color:#bff8ef}\n        .evPremiumBenefitRow span:nth-child(5){--ev-chip:231,185,108;color:#ffe0aa}", ".evPremiumBenefitRow span:nth-child(4){--ev-chip:231,185,108;color:#ffe0aa}\n        .evPremiumBenefitRow span:nth-child(5){--ev-chip:74,226,213;color:#bff8ef}\n        .evPremiumBenefitRow span:nth-child(6){--ev-chip:231,185,108;color:#ffe8bd}", 1)
          s = s.replace(".evPremiumLibraryTitle{margin-bottom:10px;font-size:22px;", ".evPremiumLibraryTitle{margin-bottom:10px;font-size:28px;", 1)
          p.write_text(s)

          p = Path('app/premium-audio-engine.ts')
          s = p.read_text()
          old = "id: 'gamma-30', category: 'work', title: 'Creative Flow'"
          if old not in s: raise SystemExit('gamma-30 engine title target missing')
          s = s.replace(old, "id: 'gamma-30', category: 'work', title: 'Creative Spark'", 1)
          p.write_text(s)

          p = Path('app/layout.tsx')
          s = p.read_text()
          s = s.replace("box-shadow: inset 0 1px 0 rgba(234, 213, 255, .055), 0 14px 38px rgba(74, 40, 150, .08);", "box-shadow: inset 0 1px 0 rgba(255, 238, 199, .065), 0 16px 42px rgba(128, 84, 16, .11);", 1)
          s = s.replace("box-shadow: 0 22px 50px rgba(99, 55, 190, .19), inset 0 0 36px rgba(160, 100, 255, .07) !important;", "box-shadow: 0 22px 52px rgba(175, 119, 25, .20), inset 0 0 36px rgba(245, 191, 83, .065) !important;", 1)
          s = s.replace("background: linear-gradient(135deg, rgba(155, 96, 37, .15), rgba(119, 74, 210, .16));", "background: linear-gradient(135deg, rgba(155, 96, 37, .16), rgba(230, 172, 66, .10));", 1)
          p.write_text(s)

          product = Path('app/V10ProductFlow.tsx').read_text()
          engine = Path('app/premium-audio-engine.ts').read_text()
          page = Path('app/page.tsx').read_text()
          checks = {
            'wrong gamma product name': "gamma-30', category: 'work', family: 'Gamma', hz: 30, label: 'Reflective Space'" not in product,
            'wrong theta product name': "theta', category: 'meditation', family: 'Theta', hz: 4, label: 'Creative Spark'" not in product,
            'old Focused Drive': 'Focused Drive' not in product and 'Focused Drive' not in engine,
            'old dark profile': 'Descending dark bed' not in product and 'Descending dark bed' not in engine,
            'old count': '20 Premium Frequencies' not in product,
            'old catalog count': '25 frequencies' not in product,
            'youtube story': 'Born from the Everlasting Voyage YouTube channel' in page,
            'future effects honesty': '15 Sound Effects · Coming Next' in product and 'Coming to Premium:' in product,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed: raise SystemExit('Final static checks failed: ' + ', '.join(failed))
          PY

      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Prepare Chrome
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Start app
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/ev-v1252.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ev-v1252.log
          exit 1

      - name: Browser product QA
        shell: bash
        run: |
          cat > /tmp/v1252-qa.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({ headless: true, executablePath: process.env.CHROME_PATH, args: ['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage'] });
          const page = await browser.newPage();
          await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
          await page.waitForSelector('#ev-premium-library');
          const result = await page.evaluate(() => {
            const categories = Array.from(document.querySelectorAll('.evPremiumCategoryTabs button'));
            const youtube = document.querySelector('.youtubeOrigin');
            const builder = document.querySelector('#session-builder');
            const libTitle = document.querySelector('.evPremiumLibraryTitle');
            const explanation = document.querySelector('.evPremiumLibraryHeader > p');
            if (!youtube || !builder || !libTitle || !explanation) throw new Error('Required V12.5.2 UI missing');
            const yr = youtube.getBoundingClientRect();
            const br = builder.getBoundingClientRect();
            return {
              categoryCount: categories.length,
              categoryTitleSizes: categories.map(b => parseFloat(getComputedStyle(b.querySelector('strong')).fontSize)),
              categorySubtitleSizes: categories.map(b => parseFloat(getComputedStyle(b.querySelector('small')).fontSize)),
              libraryTitleSize: parseFloat(getComputedStyle(libTitle).fontSize),
              explanationSize: parseFloat(getComputedStyle(explanation).fontSize),
              youtubeVisible: getComputedStyle(youtube).display !== 'none' && yr.height > 0,
              youtubeBeforeBuilder: yr.bottom <= br.top + 1,
              youtubeText: youtube.textContent || '',
              bodyOverflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth
            };
          });
          if (result.categoryCount !== 5) throw new Error(`Expected 5 categories, got ${result.categoryCount}`);
          if (Math.min(...result.categoryTitleSizes) < 18) throw new Error('Category title is still too small');
          if (Math.min(...result.categorySubtitleSizes) < 13) throw new Error('Category subtitle is still too small');
          if (result.libraryTitleSize < 27) throw new Error(`Premium library title too small: ${result.libraryTitleSize}`);
          if (result.explanationSize < 14.5) throw new Error(`Library explanation too small: ${result.explanationSize}`);
          if (!result.youtubeVisible || !result.youtubeBeforeBuilder || !result.youtubeText.includes('YouTube')) throw new Error('YouTube origin block placement/visibility failed');
          if (result.bodyOverflowX > 2) throw new Error(`Horizontal overflow detected: ${result.bodyOverflowX}`);

          const categoryButtons = await page.$$('.evPremiumCategoryTabs button');
          const expected = [7,7,7,7,7];
          for (let i = 0; i < categoryButtons.length; i++) {
            await categoryButtons[i].click();
            await new Promise(r => setTimeout(r, 80));
            const count = await page.$$eval('.evPremiumSignalGrid .evPremiumSignalCard', els => els.length);
            if (count !== expected[i]) throw new Error(`Category ${i} expected 7 cards, got ${count}`);
          }

          const previewNames = ['Solar Harmony','Celestial Radiance','Recall Spark','Knowledge Flow','Productive Rhythm','Clear Purpose','Inner Light','Serene Expansion','Moonlit Ease','Quiet Horizon'];
          for (const name of previewNames) {
            const clicked = await page.evaluate((target) => {
              const buttons = Array.from(document.querySelectorAll('.evPremiumSignalCard'));
              const card = buttons.find(el => (el.textContent || '').includes(target));
              if (!card) return false;
              card.click();
              return true;
            }, name);
            if (!clicked) {
              const tabs = await page.$$('.evPremiumCategoryTabs button');
              for (const tab of tabs) {
                await tab.click();
                await new Promise(r => setTimeout(r, 50));
                const found = await page.evaluate((target) => Array.from(document.querySelectorAll('.evPremiumSignalCard')).some(el => (el.textContent || '').includes(target)), name);
                if (found) {
                  await page.evaluate((target) => Array.from(document.querySelectorAll('.evPremiumSignalCard')).find(el => (el.textContent || '').includes(target))?.click(), name);
                  break;
                }
              }
            }
            await page.waitForSelector('.evPremiumModal', { timeout: 4000 });
            const modalText = await page.$eval('.evPremiumModal', el => el.textContent || '');
            if (!modalText.includes(name) || !modalText.includes('Immersive Frequency')) throw new Error(`Preview identity failed for ${name}`);
            await page.click('.evPreviewButton');
            await new Promise(r => setTimeout(r, 450));
            const playing = await page.$eval('.evPreviewButton', el => (el.textContent || '').includes('Stop preview'));
            if (!playing) throw new Error(`Preview did not start for ${name}`);
            await page.click('.evPreviewButton');
            await page.click('.evPremiumModalClose');
            await new Promise(r => setTimeout(r, 80));
          }
          if (pageErrors.length) throw new Error('Page errors: ' + pageErrors.join(' | '));
          await browser.close();
          EOF
          node /tmp/v1252-qa.mjs

      - name: Restore trusted workflow and commit validated polish
        shell: bash
        run: |
          git checkout 1d704e7a4548d60f62e20a3ea6c8bde21a4e7b97 -- .github/workflows/v12-1-5-session-footer-qa.yml
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f package-lock.json
          git config user.name "Everlasting Voyage Build"
          git config user.email "actions@users.noreply.github.com"
          git add app .github/workflows/v12-1-5-session-footer-qa.yml
          git commit -m "V12.5.2 final consistency and browser QA"
          git push origin HEAD:_no-vercel/v12-5-2-work
