name: V12.1.2 Chamber Visual QA

on:
  push:
    branches:
      - v12-1-2-chamber-rectangle-removal
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Prepare system Chrome capture
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_PATH" ]; then
            echo "System Chrome was not found"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Start application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/everlasting-voyage.log 2>&1 &
          echo $! > /tmp/everlasting-voyage.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/voyage >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everlasting-voyage.log
          exit 1

      - name: Capture Chamber screenshots and computed styles
        run: |
          mkdir -p visual-qa
          cat > capture-chamber.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const viewports = [
            { name: '1920x1080', width: 1920, height: 1080 },
            { name: '1440x900', width: 1440, height: 900 }
          ];

          for (const viewport of viewports) {
            const page = await browser.newPage();
            await page.setViewport({ width: viewport.width, height: viewport.height, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000/voyage', { waitUntil: 'networkidle0' });
            await page.waitForSelector('#library', { timeout: 10000 });
            await page.evaluate(() => {
              document.querySelector('#library')?.scrollIntoView({ block: 'start', behavior: 'instant' });
            });
            await new Promise((resolve) => setTimeout(resolve, 1800));

            const styles = await page.evaluate(() => {
              const selectors = [
                '#library',
                '#library .signalExperience',
                '#library .signalStage',
                '#library .evChamberOpenGlow',
                '#library .evChamberVisualLayer',
                '#library .evChamberAuras'
              ];

              return Object.fromEntries(selectors.map((selector) => {
                const element = document.querySelector(selector);
                if (!element) return [selector, null];
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return [selector, {
                  background: style.background,
                  backgroundColor: style.backgroundColor,
                  backgroundImage: style.backgroundImage,
                  border: style.border,
                  boxShadow: style.boxShadow,
                  overflow: style.overflow,
                  borderRadius: style.borderRadius,
                  rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
                }];
              }));
            });

            fs.writeFileSync(`visual-qa/chamber-${viewport.name}-styles.json`, JSON.stringify(styles, null, 2));
            await page.screenshot({ path: `visual-qa/chamber-${viewport.name}.png`, fullPage: false });
            await page.close();
          }

          await browser.close();
          EOF
          node capture-chamber.mjs
          rm capture-chamber.mjs

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-2-chamber-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 7
